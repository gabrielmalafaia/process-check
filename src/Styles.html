<style>
/* Tokens. Laranja só como acento; neutros no resto; cores vivas só para STATUS (verde, amarelo, vermelho). */
:root{
  --p:#CC3D15;--p-s:rgba(204,61,21,.10);--p-d:#AD3010;--on-p:#FFFFFF;
  --bg:#F5F6F7;--card:#FFFFFF;--tx:#1F2328;--tx2:#4B5563;--mut:#6B7280;--bd:#E4E7EB;--bd2:#CBD2D9;--hov:#F3F4F6;
  --ink:#2F3640;--ink2:#A7AFB8;
  --ok:#1E9E5A;--warn:#F2B100;--bad:#D93025;--gr:#9AA3AD;--ok-t:#146C3C;--warn-t:#7A5800;--bad-t:#B3261E;
  --ok-s:rgba(30,158,90,.12);--warn-s:rgba(242,177,0,.18);--bad-s:rgba(217,48,37,.10);
  --side:#FFFFFF;--hm:47,54,64;
  --r:8px;--s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#14171A;--card:#1E2226;--tx:#ECEFF2;--tx2:#C3C9D0;--mut:#98A1AB;--bd:#323840;--bd2:#434B55;--hov:#262B31;
  --ink:#DDE2E8;--ink2:#5B6571;--side:#1A1E22;--hm:221,226,232;--p-s:rgba(224,86,48,.22);
  --ok-s:rgba(30,158,90,.22);--warn-s:rgba(242,177,0,.22);--bad-s:rgba(217,48,37,.24);--ok-t:#5FD38D;--warn-t:#F2B100;--bad-t:#FF8A80;
}
/* Tema laranja: base clara com neutros levemente quentes; o acento laranja (#CC3D15, contraste 4,9:1 com branco) é o mesmo em todos os temas (botões, menu ativo, foco, marca).
   Cores de STATUS, gráficos e mapa de calor não mudam. Todo texto sobre fundo laranja é branco. */
[data-theme=orange]{
  --p-s:rgba(204,61,21,.12);
  --bg:#FFF6F1;--bd:#F1DED3;--bd2:#E6CDBE;--hov:#FDEDE5;
}
/* Painel lateral e barra superior em laranja, com texto branco */
[data-theme=orange] #side{background:var(--p);border-right-color:var(--p-d)}
[data-theme=orange] .brand{color:#fff;border-bottom-color:rgba(255,255,255,.28)}
[data-theme=orange] .brand small{color:rgba(255,255,255,.88)}
[data-theme=orange] #side .logo{background:#fff;color:var(--p)}
[data-theme=orange] nav button{color:#fff}
[data-theme=orange] nav button:hover{background:rgba(255,255,255,.16);color:#fff}
[data-theme=orange] nav button.on{background:rgba(255,255,255,.24);color:#fff}
[data-theme=orange] nav button.on::before{background:#fff}
[data-theme=orange] nav button.on .ic{color:#fff}
[data-theme=orange] nav .kids{border-left-color:rgba(255,255,255,.4)}
[data-theme=orange] nav button.alerta,[data-theme=orange] nav button.alerta:hover{background:#fff;color:#B3261E}
[data-theme=orange] nav button.alerta .ic{color:#B3261E}
[data-theme=orange] .who{color:rgba(255,255,255,.9);border-top-color:rgba(255,255,255,.28)}
[data-theme=orange] .who b{color:#fff}
[data-theme=orange] .autoria{color:rgba(255,255,255,.88);border-top-color:rgba(255,255,255,.28)}
[data-theme=orange] header{background:var(--p);border-bottom-color:var(--p-d);color:#fff}
[data-theme=orange] header h1,[data-theme=orange] header .upd{color:#fff}
[data-theme=orange] header>button{background:transparent;border-color:rgba(255,255,255,.7);color:#fff}
[data-theme=orange] header>button:hover{background:rgba(255,255,255,.18)}
[data-theme=orange] #side :focus-visible,[data-theme=orange] header>button:focus-visible{outline-color:#fff}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600}
h2{font-size:16px}h3{font-size:14px}
a{color:inherit}
.hidden{display:none!important}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--s4)}
.ic{flex-shrink:0;vertical-align:middle}
:focus{outline:none}
:focus-visible{outline:2px solid var(--p);outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-color:var(--p)}

/* layout */
#app{display:flex;min-height:100vh}
#side{width:248px;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:width .18s;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);border-bottom:1px solid var(--bd);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--tx);font:inherit}
.brand b{display:block;font-size:14px;line-height:1.2}
.brand small{color:var(--mut);font-weight:400;font-size:12px}
.logo{background:var(--p);color:var(--on-p);border-radius:var(--r);width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;letter-spacing:.3px;flex-shrink:0}
nav{padding:var(--s2);flex:1}
nav button{display:flex;gap:var(--s3);align-items:center;width:100%;border:0;background:none;color:var(--tx2);padding:9px var(--s3);border-radius:var(--r);cursor:pointer;font:inherit;text-align:left;position:relative}
nav button:hover{background:var(--hov);color:var(--tx)}
nav button.on{background:var(--p-s);color:var(--tx);font-weight:600}
nav button.on::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--p)}
nav button.on .ic{color:var(--p)}
nav .grp .chev{margin-left:auto;transition:transform .15s}
nav .grp[aria-expanded=true] .chev{transform:rotate(180deg)}
nav .kids{margin:2px 0 var(--s2) 0;padding-left:var(--s4);border-left:1px solid var(--bd);margin-left:var(--s4)}
nav .kids button{padding:7px var(--s3);font-size:13px}
nav .kids button.on::before{left:-17px}
body.col #side{width:64px}
body.col .brand b,body.col nav button span.t,body.col .who .wn,body.col .who .ic,body.col nav .kids,body.col nav .chev,body.col .nsec{display:none}
body.col nav button{justify-content:center}
main{flex:1;min-width:0}
header{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:6}
header h1{font-size:18px;flex:1;min-width:140px}
.upd{font-size:12px;color:var(--mut)}
.btn,header button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd2);background:var(--card);color:var(--tx);border-radius:var(--r);padding:7px var(--s3);cursor:pointer;font:inherit;font-size:13px;line-height:1.2}
.btn:hover,header button:hover{background:var(--hov)}
.btn:disabled,header button:disabled{opacity:.5;cursor:not-allowed}
.btn.pri{background:var(--p);border-color:var(--p);color:var(--on-p)}
.btn.pri:hover{background:var(--p-d)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.ico{padding:7px}
.view{padding:var(--s5)}
.view>.card:last-child{margin-bottom:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s4)}
.card>h2,.card>h3{margin-bottom:var(--s3)}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.muted{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);align-items:start}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--s4)}
.cols>.card{margin-bottom:0}
.cols+.cols,.cols+.card,.card+.cols,.kpis+.cols,.kpis+.card{margin-top:var(--s4)}

/* filtros globais dos relatórios */
#fbar{background:var(--card);border-bottom:1px solid var(--bd);padding:var(--s3) var(--s5);display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end}
#fbar .fg{display:flex;flex-direction:column;gap:3px;min-width:120px}
#fbar label{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--mut);font-weight:600}
#fbar select,#fbar input{padding:6px 8px;font-size:13px;width:auto;min-width:112px}
.seg{display:inline-flex;border:1px solid var(--bd2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;border-right:1px solid var(--bd2);background:var(--card);color:var(--tx2);padding:6px 11px;font:inherit;font-size:13px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hov)}
.seg button.on{background:var(--ink);color:var(--card)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--bd);margin:-4px 0 var(--s4);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px var(--s4);cursor:pointer;color:var(--mut);font:inherit;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--tx)}
.tabs button.on{color:var(--tx);font-weight:600;border-bottom-color:var(--p)}
.chip{border:1px solid var(--bd2);background:var(--card);color:var(--tx2);border-radius:999px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
.chip:hover{background:var(--hov)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* campos */
input,select,textarea{background:var(--card);color:var(--tx);border:1px solid var(--bd2);border-radius:var(--r);padding:8px 10px;font:inherit;width:100%}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--p)}
input:disabled,select:disabled,textarea:disabled{opacity:.6;background:var(--hov);cursor:not-allowed}
input.invalid,select.invalid,textarea.invalid{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
label,.lab{display:block;font-size:12px;color:var(--mut);font-weight:500}
label>input:not([type=checkbox]):not([type=radio]),label>select,label>textarea,label>.cb,.lab>.cb,.lab>.tags,.lab>.ro,label>.ro{display:block;margin-top:4px}
label>.err,.lab>.err{display:block;margin-top:3px}
label>small,.lab>small{display:block;margin-top:3px}
.req{color:var(--bad)}
.err{color:var(--bad);font-size:12px}
.alert{background:var(--bad-s);border:1px solid var(--bad);color:var(--tx);border-radius:var(--r);padding:10px var(--s3);margin-bottom:var(--s3);font-size:13px;display:flex;gap:var(--s2);align-items:center}
.alert .ic{color:var(--bad)}
.note{background:var(--hov);border:1px solid var(--bd);border-radius:var(--r);padding:10px var(--s3);font-size:13px;color:var(--tx2);display:flex;gap:var(--s2);align-items:flex-start}
.note.warn{background:var(--warn-s);border-color:var(--warn)}
.note .ic{margin-top:2px}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--mut);font-size:12px}
.kpi b{font-size:26px;line-height:1.2;font-weight:600}
.kpi b.ok{color:var(--ok)}.kpi b.obs{color:#B58300}.kpi b.bad{color:var(--bad)}
[data-theme=dark] .kpi b.obs{color:var(--warn)}
.kpi em{font-style:normal;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:3px}
.kpi em.up{color:var(--ok)}.kpi em.down{color:var(--bad)}

/* status */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.verde{background:var(--ok-s);color:var(--ok)}
.pill.observacao{background:var(--warn-s);color:#9A7000}
[data-theme=dark] .pill.observacao{color:var(--warn)}
.pill.vermelho{background:var(--bad-s);color:var(--bad)}
.pill.neutro{background:var(--hov);color:var(--mut)}
.pill.no_ritmo{background:var(--ok-s);color:var(--ok-t)}.pill.atingida{background:var(--ok-s);color:var(--ok-t)}
.pill.em_risco{background:var(--warn-s);color:var(--warn-t)}.pill.nao_atingida{background:var(--bad-s);color:var(--bad-t)}
.pill.futura,.pill.inativa{background:var(--hov);color:var(--mut)}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.grp-f{border:0;margin:0;padding:0;min-width:0}.grp-f>legend{padding:0}
[data-theme=dark] .pill.em_risco{color:var(--warn)}
.meter{height:6px;background:var(--hov);border-radius:3px;overflow:hidden;min-width:60px}
.meter span{display:block;height:100%;border-radius:3px;background:var(--ink2)}
.meter span.verde,.meter span.atingida,.meter span.no_ritmo{background:var(--ok)}.meter span.observacao,.meter span.em_risco{background:var(--warn)}.meter span.vermelho,.meter span.nao_atingida{background:var(--bad)}
.stk{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--hov);min-width:80px}
.stk i{display:block;height:100%}.stk .v{background:var(--ok)}.stk .o{background:var(--warn)}.stk .r{background:var(--bad)}
.tag-t{display:inline-block;border:1px solid var(--bd2);border-radius:4px;padding:0 6px;font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.3px}

/* tabelas */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px var(--s3);border-bottom:1px solid var(--bd);text-align:left;font-size:13px;vertical-align:middle}
th{color:var(--mut);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;background:var(--card)}
th[data-s]{cursor:pointer;user-select:none}
th[data-s]:hover{color:var(--tx)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--hov)}
tr.clk{cursor:pointer}
tr.saving{opacity:.5}
td.cell-ell{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:var(--s5);text-align:center;color:var(--mut)}
.toolbar{display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-bottom:var(--s3)}
.toolbar input{max-width:260px}
.pager{display:flex;gap:var(--s2);align-items:center;justify-content:flex-end;margin-top:var(--s3);font-size:13px;color:var(--mut)}
.chartbox{position:relative;height:270px}
.chartbox.sm{height:220px}

/* insights */
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
.ins li{display:flex;gap:var(--s3);align-items:flex-start;padding:10px var(--s3);border:1px solid var(--bd);border-left-width:3px;border-radius:var(--r)}
.ins li.bad{border-left-color:var(--bad)}.ins li.obs{border-left-color:var(--warn)}.ins li.ok{border-left-color:var(--ok)}.ins li.info{border-left-color:var(--gr)}
.ins .tag-t{margin-top:1px}
.ins li.bad .tag-t{color:var(--bad);border-color:var(--bad)}.ins li.obs .tag-t{color:#9A7000;border-color:var(--warn)}.ins li.ok .tag-t{color:var(--ok);border-color:var(--ok)}
[data-theme=dark] .ins li.obs .tag-t{color:var(--warn)}

/* mapa de cobertura */
.heat{overflow-x:auto}
.heat table{width:auto;border-collapse:separate;border-spacing:2px}
.heat th,.heat td{padding:0;border:0;text-align:center}
.heat th.rowh{text-align:left;padding-right:var(--s3);white-space:nowrap;font-size:12px;text-transform:none;letter-spacing:0;color:var(--tx2);font-weight:500}
.heat th.colh{font-size:10px;font-weight:500;color:var(--mut);text-transform:none;letter-spacing:0;height:16px}
.heat td i{display:block;width:20px;height:20px;border-radius:4px;background:rgba(var(--hm),.06);font-style:normal;font-size:10px;line-height:20px;color:var(--tx)}
.heat tbody tr:hover td{background:none}
.hleg{display:flex;align-items:center;gap:var(--s2);font-size:12px;color:var(--mut);margin-top:var(--s3)}
.hleg i{display:inline-block;width:16px;height:16px;border-radius:3px}

/* matriz */
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:12px;color:var(--mut);margin:var(--s3) 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:middle}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:var(--s3)}
.mc{border-radius:var(--r);padding:var(--s3);color:#fff;cursor:pointer;min-height:108px;display:flex;flex-direction:column;gap:2px;position:relative;border:0;text-align:left;font:inherit}
.mc:hover{filter:brightness(.96)}
.mc b{font-size:17px}.mc small{opacity:.95;font-size:12px}
.mc small.un{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mc.verde{background:var(--ok)}.mc.vermelho{background:var(--bad)}
.mc.observacao{background:var(--warn);color:#222}
.mc.rascunho{background:repeating-linear-gradient(135deg,#F5B400 0 10px,#FFD54F 10px 20px);color:#222;border:2px dashed #7A5C00}
.mc.rascunho::after{content:"!";position:absolute;top:8px;right:10px;width:20px;height:20px;border-radius:50%;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.mc.nunca{background:#BDBDBD;color:#222}
.mc.vencido{background:#9E9E9E;border:2px dashed var(--bad)}
.mh{display:flex;align-items:center;gap:var(--s2)}
.cs{display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid rgba(0,0,0,.28);border-radius:50%;padding:3px;vertical-align:middle;flex-shrink:0}
.csprev{display:flex;align-items:center;gap:var(--s2);min-height:38px;flex-wrap:wrap;color:var(--tx);font-size:13px}
.csprev .warn{color:#9A7000;font-size:12px;width:100%}
td .cs{margin-right:6px}
.mb{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap}
.mb .meter{width:160px}

/* formulário */
.badge{background:var(--hov);border:1px solid var(--bd);border-radius:999px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.crit{color:var(--bad);font-size:11px;font-weight:700;margin-left:6px;letter-spacing:.3px}
.item{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:10px var(--s2);border-bottom:1px solid var(--bd);flex-wrap:wrap;border-radius:var(--r)}
.item.miss{border:1px solid var(--bad);background:var(--bad-s)}
.rb{display:flex;gap:6px}
.rb label{flex-direction:row;align-items:center;gap:6px;color:var(--tx);border:1px solid var(--bd2);border-radius:var(--r);padding:6px 10px;cursor:pointer;font-size:13px;font-weight:400}
.rb label:hover{background:var(--hov)}
.rb label:has(input:checked){border-color:var(--ink);background:var(--hov);font-weight:600}
.sub{font-weight:600;color:var(--tx);margin:var(--s4) 0 var(--s1);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.bar{position:sticky;bottom:0;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:var(--s3);display:flex;gap:var(--s3);align-items:center;flex-wrap:wrap;margin-top:var(--s3);box-shadow:0 -4px 12px rgba(0,0,0,.05)}
.bar .sc{font-size:20px;font-weight:600;flex:1;min-width:200px}
.sc.ok{color:var(--ok)}.sc.bad{color:var(--bad)}.sc.obs{color:#B58300}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tags:empty{display:none}
.ro{min-height:36px;display:flex;align-items:center;padding:7px var(--s3);border:1px solid var(--bd);border-radius:var(--r);background:var(--hov);color:var(--tx);font-size:13px;font-weight:400}
.tagc{display:inline-flex;align-items:center;gap:4px;background:var(--hov);border:1px solid var(--bd2);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px;color:var(--tx)}
.tagc button{border:0;background:none;color:var(--mut);cursor:pointer;display:inline-flex;padding:2px;border-radius:50%}
.tagc button:hover{background:var(--bd);color:var(--tx)}
.cb{position:relative}
.cb input{padding-right:30px}
.cbl{position:absolute;z-index:15;left:0;right:0;top:100%;margin:4px 0 0;padding:4px;list-style:none;background:var(--card);border:1px solid var(--bd2);border-radius:var(--r);max-height:280px;overflow:auto;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.cbl li{padding:8px 10px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:var(--s2);color:var(--tx);font-size:13px}

/* acessos */

.sect{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);font-weight:600;margin:var(--s4) 0 var(--s2)}
.perfs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s3);margin-bottom:var(--s4)}

/* meta */
.meta-t{display:flex;align-items:center;gap:var(--s3);padding:6px 0}

/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:5vh var(--s4);overflow:auto}

.it-ok{color:var(--ok)}.it-no{color:var(--bad)}.it-na{color:var(--mut)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22272B;color:#fff;padding:11px 18px;border-radius:var(--r);z-index:75;max-width:90%;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25)}

@media(max-width:860px){

  .view{padding:var(--s3)}

}
.autoria{padding:10px var(--s3) 12px;font-size:10.5px;line-height:1.4;color:var(--mut);border-top:1px solid var(--bd)}

/* ---------- tela de carregamento ---------- */
#carregando{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .28s ease,visibility .28s}
#carregando.saindo{opacity:0;visibility:hidden}
.pl-bar{position:absolute;top:0;left:0;right:0;height:3px;overflow:hidden}
.pl-bar i{display:block;height:100%;width:38%;background:var(--p);border-radius:0 3px 3px 0;animation:plbar 1.35s cubic-bezier(.4,0,.2,1) infinite}
.pl-box{display:flex;flex-direction:column;align-items:center;gap:16px;animation:plin .5s ease both;padding:var(--s4);text-align:center}
.pl-mark{position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center}
.pl-ring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--bd);border-top-color:var(--p);animation:plspin .9s linear infinite}
.pl-logo{width:50px;height:50px;border-radius:14px;font-size:17px;animation:plpulse 1.8s ease-in-out infinite}
.pl-name{font-size:17px;font-weight:600;letter-spacing:.2px;line-height:1.25}
.pl-name small{display:block;color:var(--mut);font-weight:400;font-size:12px;margin-top:3px;letter-spacing:.3px}
.pl-txt{font-size:12px;color:var(--mut);display:flex;align-items:baseline;gap:2px;min-height:18px}
.pl-d i{display:inline-block;width:3px;height:3px;border-radius:50%;background:var(--mut);margin-left:3px;animation:pldot 1.2s ease-in-out infinite}
.pl-d i:nth-child(2){animation-delay:.18s}.pl-d i:nth-child(3){animation-delay:.36s}
@keyframes plspin{to{transform:rotate(360deg)}}
@keyframes plbar{0%{transform:translateX(-100%)}100%{transform:translateX(270%)}}
@keyframes plin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes plpulse{0%,100%{transform:scale(1)}50%{transform:scale(.94)}}
@keyframes pldot{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ---------- tela de login e cadastro ---------- */
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;grid-template-columns:minmax(300px,42%) 1fr;overflow:auto;animation:lgin .35s ease both;transition:opacity .28s ease}
#login.saindo{opacity:0}
@keyframes lgin{from{opacity:0}to{opacity:1}}
.lg-brand{background:var(--p);color:var(--on-p);padding:44px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:var(--s5);position:relative;overflow:hidden;min-height:100vh}
.lg-brand::after{content:"";position:absolute;width:520px;height:520px;border-radius:50%;border:1px solid currentColor;opacity:.14;right:-260px;bottom:-200px;pointer-events:none}
.lg-brand::before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;border:1px solid currentColor;opacity:.14;right:-170px;bottom:-110px;pointer-events:none}
.lg-top{display:flex;align-items:center;gap:var(--s3);position:relative;z-index:1}
.lg-top b{display:block;font-size:17px;line-height:1.2}
.lg-top small{display:block;font-size:12px;opacity:.85;margin-top:2px}
.lg-logo{width:42px;height:42px;border-radius:12px;background:var(--on-p);color:var(--p);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;letter-spacing:.3px}
.lg-msg{position:relative;z-index:1;max-width:420px}
.lg-msg h2{font-size:28px;line-height:1.2;font-weight:600;margin-bottom:var(--s3)}
.lg-msg p{margin:0;font-size:14px;line-height:1.55;opacity:.9}
.lg-foot{font-size:11px;opacity:.8;position:relative;z-index:1;line-height:1.5}
.lg-main{display:flex;align-items:center;justify-content:center;padding:56px var(--s5) var(--s5);position:relative}
.lg-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:32px;animation:plin .35s ease both}
.lg-card h1{font-size:22px;margin-bottom:6px}
.lg-sub{margin:0 0 var(--s5);color:var(--mut);font-size:13px;line-height:1.5}
.lg-btn{width:100%;justify-content:center;padding:11px var(--s4);font-size:14px;font-weight:600}
.lg-or{display:flex;align-items:center;gap:var(--s3);color:var(--mut);font-size:12px;margin:var(--s4) 0}
.lg-or::before,.lg-or::after{content:"";flex:1;height:1px;background:var(--bd)}
.lg-link{display:block;margin:var(--s4) auto 0;background:none;border:0;color:var(--tx2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font:inherit;font-size:13px;padding:4px}
.lg-link:hover{color:var(--tx)}
.lg-conta{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);border:1px solid var(--bd);border-radius:var(--r);background:var(--hov);margin-bottom:var(--s4);font-size:13px;word-break:break-all}
.lg-conta small{display:block;color:var(--mut);font-size:11px}
.lg-hint{margin:var(--s4) 0 0;font-size:12px;color:var(--mut);line-height:1.5}
.lg-dica{display:block;margin-top:4px;font-size:12px;color:var(--mut);font-weight:400}
.lg-acoes{display:flex;flex-direction:column;gap:var(--s2);margin-top:var(--s5)}
.lg-card label{margin-bottom:var(--s3)}
.lg-card .err{color:var(--bad);font-size:12px;display:block;margin-top:3px}
.lg-tema{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:3}

/* ---------- v6.2: menu em seções, menu do usuário, busca, cabeçalho ---------- */
.nsec{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);padding:14px var(--s3) 4px}

[data-theme=orange] .nsec{color:rgba(255,255,255,.88)}

.av{width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}

[data-theme=orange] #userBtn{color:#fff}
[data-theme=orange] #userBtn:hover{background:rgba(255,255,255,.16)}

#busca kbd{background:transparent;font:inherit;font-size:11px;color:var(--mut);border:1px solid var(--bd2);border-radius:4px;padding:1px 5px;margin-left:6px}

#cmdk{position:fixed;inset:0;z-index:80;background:rgba(15,18,21,.5);display:flex;align-items:flex-start;justify-content:center;padding:12vh var(--s4) var(--s4)}
.cbox{width:100%;max-width:560px;background:var(--card);border:1px solid var(--bd2);border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.cin{display:flex;align-items:center;gap:var(--s3);padding:12px var(--s4);border-bottom:1px solid var(--bd);color:var(--mut)}

header h1{flex:1}
.lg-lang{display:inline-flex;gap:2px;margin-right:6px;border:1px solid var(--bd2);border-radius:999px;padding:2px;background:var(--card)}

.lg-tema{align-items:center}

.tabs button .badge-n{margin-left:8px;vertical-align:middle}

#toast{display:flex;align-items:center;gap:var(--s3)}

/* ---------- indicador global de espera ---------- */
#rpcbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .15s}

.mfil{gap:6px}
